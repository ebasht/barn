name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build release bundle
        env:
          DOCKER_PLATFORM: linux/amd64
          NEXT_PUBLIC_API_URL: auto
        run: |
          chmod +x scripts/*.sh
          ./scripts/make-release.sh "${GITHUB_REF_NAME}"

      # Prefer gh CLI over softprops/action-gh-release: large image tarballs
      # previously failed with "Error creating asset temp dir" under Node 20→24.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/barn-*.tar.gz dist/dock-pilot-*.tar.gz dist/barn-images.tar.gz)
          if ((${#assets[@]} == 0)); then
            echo "No release assets in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          ls -lh "${assets[@]}"
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --generate-notes
          fi
