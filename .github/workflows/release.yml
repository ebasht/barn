name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build release bundle
        env:
          DOCKER_PLATFORM: linux/amd64
          NEXT_PUBLIC_API_URL: auto
        run: |
          chmod +x scripts/*.sh
          ./scripts/make-release.sh "${GITHUB_REF_NAME}"

      # Upload only release bundles. Images live inside barn-*.tar.gz /
      # dock-pilot-*.tar.gz — a separate barn-images.tar.gz upload often hits
      # GitHub's 500 "Error creating asset temp dir" on large assets.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/barn-*.tar.gz dist/dock-pilot-*.tar.gz)
          # Exclude nested dirs accidentally matching *.tar.gz if any.
          filtered=()
          for f in "${assets[@]}"; do
            [[ -f "$f" ]] || continue
            # Skip raw image export; install/upgrade use the bundles only.
            case "$(basename "$f")" in
              barn-images.tar.gz|dock-pilot-images.tar.gz) continue ;;
            esac
            filtered+=("$f")
          done
          if ((${#filtered[@]} == 0)); then
            echo "No release bundles in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          ls -lh "${filtered[@]}"
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${filtered[@]}" --clobber
          else
            gh release create "$tag" "${filtered[@]}" \
              --title "$tag" \
              --generate-notes
          fi
